# @dsh-external/self-iteration-forge bundle patch（host 半区：forge_capability 工具 + /self-iteration status|stats + 工具调用次数账本）。
# 安装：dsh plugin --profile web add link:<this-directory>
#
# config 全部可选（默认值见 src/index.ts 的 DEFAULTS）：
#   targetRoot       迁移根目录；留空 = 工作区父目录/dsh-plugins（与工作区平级）
#   stagingRoot      staging 根；留空 = 工作区/.forge-staging
#   harnessRoot      deepseek-harness 检出根；留空 = 自动查找
#   subagentProvider 子代理 provider（默认 spawn）
#   installProfile   装入的 profile 名；留空 = 自动探测当前 profile（bundle 含 @deepseek-ai/dsh-web-app 者）
#   autoInstall      成功后自动装入当前 profile（默认 true；forge_capability 的 install:false 可关闭单次）
#   maxChildDepth    子代理委托深度上限（默认 2）
#   childTimeoutMs   子代理/构建超时（默认 45 分钟）
#   commitType / push / gitAuthorName / gitAuthorEmail / keepStaging / stagingTtlDays / referenceRepos
- insert:
    - id: self-iteration-forge
      name: '@dsh-external/self-iteration-forge'
      config:
        targetRoot: ''
        stagingRoot: ''
        harnessRoot: ''
        subagentProvider: spawn
        maxChildDepth: 2
        childTimeoutMs: 2700000
        commitType: feat
        push: false
        gitAuthorName: csiroqa
        gitAuthorEmail: justinwangyj@163.com
        keepStaging: true
        installProfile: ''
        autoInstall: true
